<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depth Anything 3</title>
    <!-- ONNX Runtime を CDN から読み込み（最新版） -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>🌊 Depth Anything 3</h1>
      <p class="subtitle">ONNX デスクトップアプリ</p>
      
      <div class="controls">
        <input type="file" id="imageInput" accept="image/*" />
        <button id="processBtn" disabled>深度推定を実行</button>
      </div>
      
      <p id="status">モデル読み込み中...</p>
      
      <div class="results">
        <div class="image-box">
          <h3>入力画像</h3>
          <img id="inputImage" />
        </div>
        <div class="image-box">
          <h3>深度マップ</h3>
          <canvas id="depthCanvas"></canvas>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
